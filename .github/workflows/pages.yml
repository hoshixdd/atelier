name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NITRO_PRESET: github_pages
      BASE_PATH: /atelier/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build || NITRO_PRESET=static npm run build
      - name: Pick static output
        run: |
          set -e
          if [ -d .output/public ]; then OUT=.output/public
          elif [ -d dist ]; then OUT=dist
          elif [ -d .vercel/output/static ]; then OUT=.vercel/output/static
          else echo "No static output" && ls -la && exit 1
          fi
          mkdir -p _site
          cp -R "$OUT"/. _site/
          touch _site/.nojekyll
          if [ ! -f _site/index.html ] && [ -f _site/404.html ]; then
            cp _site/404.html _site/index.html
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
